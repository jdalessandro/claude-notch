name: Update Homebrew cask

# The dmg is built, notarized and uploaded locally by scripts/release.sh (hosted runners lack the macOS 27.3 SDK).
# This job only bumps the cask in the tap once the release is published.
on:
  release:
    types: [published]

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version and checksum
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "ClaudeNotch-$VERSION.dmg" --repo "$GITHUB_REPOSITORY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "ClaudeNotch-$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }} # fine-grained PAT, contents:write on jdalessandro/homebrew-tap only
          VERSION: ${{ steps.rel.outputs.version }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jdalessandro/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/VERSION/$VERSION/" -e "s/SHA256/$SHA/" packaging/claude-notch.rb.template > tap/Casks/claude-notch.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/claude-notch.rb
          git commit -m "claude-notch $VERSION"
          git push
