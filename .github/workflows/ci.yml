name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # The app target needs the macOS 27.3 SDK (ActivityKit), which hosted runners do not have yet: CI covers the
      # SwiftPM core and hook; the app is built locally with `make bundle`.
      - name: Build
        run: swift build

      - name: Test
        # Serial: the socket tests block threads, and parallel suites starve the small CI runner's thread pool.
        run: swift test --no-parallel

      - name: Lint
        run: swift format lint --strict -r Sources Tests App Shared Widget Package.swift
